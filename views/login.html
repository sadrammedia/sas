<!-- views/login.html -->
<div class="absolute top-0 left-0 w-full h-[60%] bg-gradient-to-b from-blue-100/60 to-transparent z-0 pointer-events-none"></div>
<div class="absolute top-0 right-0 w-64 h-64 bg-teal-200/20 rounded-full blur-3xl -mr-20 -mt-20 z-0 pointer-events-none"></div>

<div class="absolute bottom-0 left-0 w-full z-0 flex flex-col justify-end h-[35%] pointer-events-none">
    <svg viewBox="0 0 1440 320" class="w-full h-auto -mb-1" preserveAspectRatio="none">
        <path fill="#0284c7" fill-opacity="1" d="M0,160L48,176C96,192,192,224,288,218.7C384,213,480,171,576,160C672,149,768,171,864,197.3C960,224,1056,256,1152,245.3C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
    <div class="bg-[#0284c7] w-full flex-1 flex justify-between items-start px-8 pt-2 overflow-hidden relative">
        <div class="text-white transform -rotate-6 relative z-10 mt-2">
            <p class="font-serif italic font-bold text-lg leading-tight text-blue-100">Bersama Teknologi</p>
            <p class="font-serif italic font-bold text-lg leading-tight text-white">Menuju Prestasi</p>
        </div>
        <i class="fas fa-video text-white/20 text-7xl transform rotate-12 -mt-6 -mr-4"></i>
    </div>
</div>

<div class="relative z-10 w-full h-full flex flex-col overflow-y-auto custom-scroll px-6 pt-10 pb-16">
    <div class="flex items-center gap-3 mb-8">
        <div class="w-14 h-14 shrink-0 flex items-center justify-center">
            <img id="login-logo-img" src="" onerror="this.style.display='none'; document.getElementById('login-logo-icon').style.display='block';" class="w-full h-full object-contain hidden drop-shadow-md">
            <i id="login-logo-icon" class="fas fa-school text-teal-600 text-4xl"></i>
        </div>
        <div>
            <h1 class="font-bold text-blue-900 text-sm leading-tight">SMKN 1 Tasikmalaya<br><span class="text-teal-600 text-[11px]">BROADCASTING & PERFILMAN</span></h1>
            <p class="text-[9px] text-gray-500 font-medium tracking-wide mt-0.5">Disiplin . Kreatif . Profesional</p>
        </div>
    </div>

    <div class="mb-16">
        <h2 class="text-4xl font-extrabold text-[#1e3a8a] mb-1 tracking-tight drop-shadow-sm">Selamat Datang</h2>
        <h3 class="text-lg text-blue-800 font-medium mb-3">di Aplikasi Presensi Siswa</h3>
        <p class="text-[11px] text-gray-600 leading-relaxed max-w-[85%]">Masuk untuk mengakses fitur presensi, jadwal, dan informasi sekolah.</p>
    </div>

    <div class="bg-white/95 backdrop-blur-md rounded-[2rem] p-6 shadow-[0_15px_40px_rgba(0,0,0,0.08)] relative mt-auto border border-white/50">
        <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
            <div class="w-20 h-20 rounded-full bg-gradient-to-b from-[#2dd4bf] to-[#2563eb] p-1 shadow-xl">
                <div class="w-full h-full rounded-full border-2 border-white flex items-center justify-center text-white text-3xl">
                    <i class="fas fa-user-graduate"></i>
                </div>
            </div>
        </div>

        <div class="mt-10 space-y-5">
            <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-teal-600 shrink-0 mt-1 shadow-sm border border-blue-100">
                    <i class="fas fa-user text-sm"></i>
                </div>
                <div class="flex-1">
                    <label class="block text-[11px] font-bold text-blue-900 mb-1.5">ID Pengguna (NIS/NIP)</label>
                    <input type="text" id="login-id" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-gray-700 bg-gray-50 hover:bg-white transition-colors" placeholder="Masukkan ID Anda">
                </div>
            </div>

            <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-teal-600 shrink-0 mt-1 shadow-sm border border-blue-100">
                    <i class="fas fa-lock text-sm"></i>
                </div>
                <div class="flex-1 relative">
                    <label class="block text-[11px] font-bold text-blue-900 mb-1.5">Kata Sandi</label>
                    <input type="password" id="login-pass" class="w-full border border-gray-200 rounded-xl pl-4 pr-10 py-3 text-sm outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-gray-700 bg-gray-50 hover:bg-white transition-colors" placeholder="Masukkan kata sandi">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-[28px] w-8 h-8 flex items-center justify-center text-gray-400 hover:text-teal-600 transition-colors">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <p id="login-error" class="text-red-500 text-[11px] font-bold text-center hidden bg-red-50 p-2 rounded-lg border border-red-100"><i class="fas fa-exclamation-triangle mr-1"></i> ID atau Kata Sandi salah!</p>

            <button id="btn-login" onclick="handleLogin()" class="w-full bg-gradient-to-r from-[#0d9488] to-[#0284c7] hover:from-teal-600 hover:to-blue-700 text-white font-bold py-4 rounded-full shadow-[0_8px_20px_rgba(13,148,136,0.3)] transition-all flex justify-center items-center gap-3 active:scale-95 mt-4">
                <span class="w-6 h-6 bg-white rounded-full flex items-center justify-center text-teal-600 shadow-sm"><i class="fas fa-arrow-right text-[10px]"></i></span>
                <span class="text-sm tracking-wide">Masuk Sistem</span>
            </button>

            <div class="mt-4 pt-4 border-t border-gray-100 flex justify-center">
                <p id="db-status-indicator" class="text-orange-500 text-[11px] font-semibold text-center"><i class="fas fa-spinner fa-spin"></i> Mengecek koneksi...</p>
            </div>
        </div>
    </div>
</div>
