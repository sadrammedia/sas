<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: linear-gradient(rgba(34, 211, 238, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.2) 1px, transparent 1px); background-size: 30px 30px; z-index: 1;"></div>

<button onclick="closeScanner()" class="absolute top-10 left-6 text-white text-xl z-20 bg-white/5 w-10 h-10 rounded-full flex items-center justify-center backdrop-blur-md hover:bg-white/20 transition-colors border border-white/10">
    <i class="fas fa-arrow-left text-sm"></i>
</button>

<div class="w-full mt-16 z-20">
    <div class="flex justify-between items-end mb-3">
        <div>
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-0.5">Lokasi Terkini:</p>
            <p class="text-white font-bold text-sm" id="scanner-lokasi-text">Sekolah SMK Tasikmalaya</p>
        </div>
        <span class="bg-emerald-500 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.4)]">Valid</span>
    </div>
    <div class="w-full h-24 bg-gray-200 rounded-2xl overflow-hidden shadow-lg border border-slate-700/50 relative">
            <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?q=Tasikmalaya&t=&z=14&ie=UTF8&iwloc=&output=embed" class="pointer-events-none" style="filter: opacity(0.9);"></iframe>
            <div class="absolute inset-0 bg-blue-900/10 z-10 pointer-events-none"></div>
    </div>
</div>

<div class="flex-1 flex flex-col items-center justify-center w-full relative z-20 -mt-4">
    <div class="w-[280px] h-[280px] relative flex items-center justify-center">
        <div class="absolute top-0 left-0 w-10 h-10 border-t-4 border-l-4 border-cyan-400 rounded-tl-2xl shadow-[-5px_-5px_15px_rgba(34,211,238,0.15)]"></div>
        <div class="absolute top-0 right-0 w-10 h-10 border-t-4 border-r-4 border-cyan-400 rounded-tr-2xl shadow-[5px_-5px_15px_rgba(34,211,238,0.15)]"></div>
        <div class="absolute bottom-0 left-0 w-10 h-10 border-b-4 border-l-4 border-cyan-400 rounded-bl-2xl shadow-[-5px_5px_15px_rgba(34,211,238,0.15)]"></div>
        <div class="absolute bottom-0 right-0 w-10 h-10 border-b-4 border-r-4 border-cyan-400 rounded-br-2xl shadow-[5px_5px_15px_rgba(34,211,238,0.15)]"></div>
        
        <div class="w-64 h-56 relative flex justify-center items-center">
            <div class="absolute inset-0 bg-cyan-400 shadow-[0_0_25px_rgba(34,211,238,0.6)]" style="clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);"></div>
            
            <div class="absolute inset-[3px] bg-[#091525] flex items-center justify-center overflow-hidden" style="clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);">
                <img id="scanner-student-photo" src="" class="absolute w-full h-full object-cover opacity-90 hidden">
                <i class="fas fa-user text-6xl text-slate-500" id="scanner-student-icon"></i>

                <!-- Video Kamera Live -->
                <video id="camera-feed" class="absolute w-full h-full object-cover hidden z-10 opacity-90" autoplay playsinline></video>
                
                <!-- Gambar Preview Hasil Jepretan -->
                <img id="camera-preview-captured" class="absolute w-full h-full object-cover hidden z-15" alt="Hasil Foto">

                <div id="scan-grid-overlay" class="absolute inset-0 opacity-30 pointer-events-none z-10" style="background-image: linear-gradient(rgba(34, 211, 238, 0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.4) 1px, transparent 1px); background-size: 15px 15px;"></div>
                <div id="scan-laser-line" class="absolute w-full h-1 bg-cyan-300 shadow-[0_0_20px_#67e8f9,0_0_10px_#fff] animate-scan z-20"></div>
            </div>
        </div>
    </div>
    
    <div class="mt-6 text-center relative z-20">
        <h3 class="text-white font-bold text-xl tracking-wide mb-1" id="scan-title">Memindai Wajah...</h3>
        <p class="text-cyan-400 font-semibold text-sm" id="scan-text">Kamera Siap</p>
    </div>
</div>

<!-- Tombol Aksi Jepret / Konfirmasi -->
<div class="w-full flex flex-col items-center mb-8 z-20">
    <!-- Mode 1: Ambil Foto -->
    <div id="wrap-btn-capture" class="flex flex-col items-center">
        <button id="btn-take-photo" onclick="handleAmbilFoto()" class="w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white border-2 border-emerald-300 animate-soft-pulse hover:scale-105 transition-transform shadow-lg">
            <i class="fas fa-camera text-3xl drop-shadow-md"></i>
        </button>
        <p id="lbl-absen-tipe" class="text-emerald-400 font-bold text-xs uppercase tracking-wider mt-3 text-center">Tekan untuk Jepret Foto</p>
    </div>

    <!-- Mode 2: Preview & Kirim -->
    <div id="wrap-btn-confirm" class="hidden flex-col items-center w-full px-6 gap-3">
        <div class="flex gap-3 w-full max-w-xs">
            <button id="btn-retake-photo" onclick="handleUlangiFoto()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 border border-slate-600 transition-colors">
                <i class="fas fa-redo"></i> Ulangi Foto
            </button>
            <button id="btn-submit-absen" onclick="processAbsenToCloud()" class="flex-1 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95">
                <i class="fas fa-paper-plane"></i> Kirim Presensi
            </button>
        </div>
        <p class="text-cyan-300 text-[11px] font-medium text-center">Periksa foto Anda sebelum dikirim</p>
    </div>
</div>
